global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: otel-collector       # application metrics (all services) exported via OTLP
    honor_labels: true             # keep job=<service name> from the exporter (e.g. checkout-svc)
    static_configs:
      - targets: ["otel-collector:8889"]
  - job_name: rabbitmq             # queue depth per queue (incl. the dead-letter queue)
    metrics_path: /metrics/per-object
    static_configs:
      - targets: ["rabbitmq:15692"]
  - job_name: traefik
    static_configs:
      - targets: ["traefik:8080"]
