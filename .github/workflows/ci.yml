name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python services (lint · types · tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: Install workspace (locked)
        run: uv sync --all-packages --frozen
      - name: Ruff (lint + format)
        run: |
          uv run ruff check libs services
          uv run ruff format --check libs services
      - name: Mypy (strict)
        run: uv run mypy libs/common/src services/commerce/src services/agent/src services/gateway/src services/checkout/src services/fulfillment/src
      - name: Tests (unit, property, integration with real Postgres via testcontainers)
        run: uv run pytest -q

  widget:
    name: Chat widget (types · tests · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: widget
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: widget/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  service-images:
    name: Image · ${{ matrix.service }}-svc
    runs-on: ubuntu-latest
    needs: [python]
    strategy:
      matrix:
        service: [commerce, agent, gateway, checkout, fulfillment]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/python-service.Dockerfile   # shared multi-stage build
          build-args: SERVICE=${{ matrix.service }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  widget-image:
    name: Image · widget
    runs-on: ubuntu-latest
    needs: [widget]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: widget
          push: false
