<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mock Stripe Checkout (dev only)</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f9fc; font-family: system-ui, sans-serif; color: #30313d; }
      .card { width: min(380px, 92vw); background: white; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,.08); padding: 28px; }
      .badge { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; background: #fff4d6; color: #8a5a00; padding: 3px 8px; border-radius: 99px; }
      h1 { font-size: 15px; font-weight: 500; color: #6d6e78; margin: 16px 0 4px; }
      .amount { font-size: 34px; font-weight: 700; margin: 0 0 20px; }
      .field { border: 1px solid #e0e0e6; border-radius: 8px; padding: 12px; margin-bottom: 10px; color: #6d6e78; font-size: 14px; }
      button { width: 100%; height: 44px; border: 0; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 8px; }
      .pay { background: #635bff; color: white; }
      .cancel { background: transparent; color: #6d6e78; }
      .done { text-align: center; font-size: 15px; }
    </style>
  </head>
  <body>
    <main class="card" id="card">
      <span class="badge">Test mode · mock</span>
      <h1>Northwind Outfitters</h1>
      <p class="amount" id="amount">…</p>
      <div class="field">4242 4242 4242 4242</div>
      <div class="field">12 / 34 &nbsp;&nbsp; CVC 123</div>
      <button class="pay" id="pay">Pay</button>
      <button class="cancel" id="cancel">Cancel and return</button>
    </main>
    <script>
      // Stands in for Stripe Checkout + webhooks in the dev playground: reports the
      // outcome to the widget tab over BroadcastChannel.
      const params = new URLSearchParams(location.search);
      const orderId = params.get('order');
      const currency = params.get('currency') || 'USD';
      const minor = Number(params.get('amount') || 0);
      const fmt = new Intl.NumberFormat('en-US', { style: 'currency', currency });
      const digits = fmt.resolvedOptions().maximumFractionDigits;
      document.getElementById('amount').textContent = fmt.format(minor / 10 ** digits);

      const channel = new BroadcastChannel('cc-mock-stripe');
      const finish = (type, message) => {
        channel.postMessage({ type, orderId });
        document.getElementById('card').innerHTML = `<p class="done">${message}<br/><br/>You can close this tab and return to the store.</p>`;
      };
      document.getElementById('pay').onclick = () => finish('paid', '✅ Payment successful');
      document.getElementById('cancel').onclick = () => finish('canceled', 'Payment canceled. You were not charged.');
    </script>
  </body>
</html>
