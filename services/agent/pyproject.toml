[project]
name = "agent-svc"
version = "0.1.0"
description = "Conversational agent: LangGraph StateGraph + ChatGroq tool calling over commerce-svc."
requires-python = ">=3.13"
dependencies = [
    "commerce-common",
    "fastapi>=0.116",
    "uvicorn[standard]>=0.35",
    "httpx>=0.28",
    "tenacity>=9.1",
    "redis>=6",
    "langgraph>=1.2",
    "langchain-core>=1.6",
    "langchain-groq>=1.1",
    "langgraph-checkpoint-postgres>=3.1",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
]

[tool.uv.sources]
commerce-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_svc"]
