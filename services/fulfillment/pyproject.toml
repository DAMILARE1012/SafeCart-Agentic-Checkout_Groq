[project]
name = "fulfillment-svc"
version = "0.1.0"
description = "Fulfilment worker: consumes order.paid, calls the fulfilment provider, publishes the outcome."
requires-python = ">=3.13"
dependencies = [
    "commerce-common",
    "fastapi>=0.116",
    "uvicorn[standard]>=0.35",
    "sqlalchemy[asyncio]>=2.0.41",
    "asyncpg>=0.30",
    "alembic>=1.16",
    "faststream[rabbit]>=0.7",
    "httpx>=0.28",
    "tenacity>=9.1",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
]

[tool.uv.sources]
commerce-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fulfillment_svc"]
