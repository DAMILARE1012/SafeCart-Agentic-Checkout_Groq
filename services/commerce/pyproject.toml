[project]
name = "commerce-svc"
version = "0.1.0"
description = "Catalog, search, pricing & FX, promotions, tax, carts and quotes. The deterministic money core."
requires-python = ">=3.13"
dependencies = [
    "commerce-common",
    "fastapi>=0.116",
    "uvicorn[standard]>=0.35",
    "sqlalchemy[asyncio]>=2.0.41",
    "asyncpg>=0.30",
    "alembic>=1.16",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "cryptography>=45",
]

[tool.uv.sources]
commerce-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/commerce_svc"]
